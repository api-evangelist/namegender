aid: namegender
name: NameGender
description: NameGender provides a gender detection API that returns gender, probability, and supporting evidence for first names, full names,
  emails, or usernames. It supports multiple languages and countries, offers a free tier with 100 daily credits, and includes detailed documentation,
  pricing, client libraries, and research resources.
