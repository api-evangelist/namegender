description: NameGender webhooks are delivered via HTTPS POST with a JSON body. Each request includes a `NameGender-Signature` header containing
  a timestamp and one or two HMAC‑SHA256 signatures computed with the webhook secret. The secret is read from the environment variable `NAMEGENDER_WEBHOOK_SECRET`.
  Requests must be verified before processing; invalid signatures or timestamps older than 5 minutes must be rejected with HTTP 400. The `NameGender-Event-Id`
  header (same as the `id` field in the body) is used for deduplication. Delivery attempts are indicated by the `NameGender-Delivery-Attempt`
  header, starting at 1 and increasing up to 8. Failed deliveries are retried with back‑off intervals of 1 min, 5 min, 30 min, 2 h, 6 h, 12 h,
  and 24 h; after 8 attempts the event is dropped.
