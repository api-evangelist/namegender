openapi: 3.2.0
info:
  title: NameGender Account API
  version: 1.0.0
  summary: Infer gender from names, emails and usernames, with the evidence behind each answer.
  description: 'Every lookup endpoint accepts both GET and POST so it can be called from a browser, a shell or a server. All paths live under `/api/v1`; a future breaking change will get a new version prefix instead of altering these.


    **Success and failure.** The HTTP status code is the only success signal: a 200 carries the result, anything else carries the error body described below. There is no separate success flag in the JSON.


    **Credits.** One credit per resolved name, not per request: a bulk call for 100 names costs 100 credits. Credits are checked before any work starts, so a request is never half-processed. Free accounts get 100 credits per day.


    **Rate limit.** 1200 requests per minute per API key by default, counted per key rather than per IP so that several customers behind one address do not share a bucket. Every response carries `X-RateLimit-Remaining`; a 429 carries `Retry-After`.


    **Errors.** Every failure, at every status code, returns the same body shape. Branch on the machine-readable `error` field, never on `message`: messages are translated into 22 languages and their wording can change.


    **Support.** Each response carries a `request_id`, also sent as the `X-Request-Id` header. Quote it in any support request and we can find the exact call in our logs. You may send your own `X-Request-Id` to correlate with your tracing system.


    **Data version.** Responses include `data_version`, the name-dataset snapshot that produced the answer. If a result changes between two calls, comparing this field is the first thing to check.'
  contact:
    url: https://namegender.com/docs
servers:
- url: https://namegender.com
  description: Production
security:
- bearerAuth: []
- apiKeyHeader: []
tags:
- name: Account
  description: Credit balance and key status.
paths:
  /api/v1/me:
    get:
      tags:
      - Account
      summary: Credit balance and account status
      description: Costs no credits. Use it to show remaining balance in your own dashboard, or to check a key is live before a large batch.
      operationId: getAccount
      responses:
        '200':
          description: Account status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
components:
  responses:
    '429':
      description: 'Rate limit exceeded, or too many file jobs running at once. Wait `retry_after` seconds. Codes: `rate_limited`, `too_many_batches`.'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      description: Unexpected server error. Nothing was charged. Quote `request_id` if it persists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: 'No usable API key. Codes: `missing_key`, `invalid_key`, `revoked_key`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AccountResponse:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Account email address.
        credits_remaining:
          type: integer
          description: Purchased credits plus whatever is left of today's free quota.
        purchased_credits:
          type: integer
          description: Paid balance. Credits stay on your balance until you spend them.
        free_today:
          type: integer
          description: Free credits left today. Resets at midnight UTC.
        free_daily_limit:
          type: integer
          description: Free credits granted per day.
        lifetime_requests:
          type: integer
          description: Requests made with this account so far.
        data_version:
          type:
          - string
          - 'null'
          description: Current name-dataset snapshot.
    Error:
      type: object
      description: The one error shape. Returned by every endpoint at every failing status code.
      required:
      - error
      - message
      - docs
      properties:
        error:
          type: string
          description: Machine-readable and stable. **Branch on this.** New codes may be added over time, so treat an unrecognised value as a generic failure rather than crashing.
          enum:
          - missing_key
          - invalid_key
          - revoked_key
          - blocked
          - email_not_verified
          - ip_not_allowed
          - proxy_secret_required
          - forbidden
          - no_credits
          - missing_input
          - invalid_input
          - too_many_items
          - ai_consent_required
          - unknown_endpoint
          - method_not_allowed
          - payload_too_large
          - rate_limited
          - batch_not_found
          - batch_not_startable
          - batch_not_finished
          - batch_in_progress
          - result_gone
          - too_many_batches
          - not_ready
          - server_error
        message:
          type: string
          description: Human-readable, translated into the caller's language. Wording can change; never parse or compare it.
        request_id:
          type:
          - string
          - 'null'
          description: Quote this in support requests.
          example: req_9c1f5b2a7e0d4a13
        docs:
          type: string
          format: uri
          description: Link to this error in the documentation.
        errors:
          type: object
          description: Field-level detail. Present on validation failures only.
          additionalProperties:
            type: array
            items:
              type: string
        retry_after:
          type: integer
          description: Seconds to wait. Present on 429 only, and mirrored in the `Retry-After` header.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Recommended: `Authorization: Bearer <key>`.'
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Alternative header form, for clients that cannot set `Authorization`. Keys are never read from the query string or the request body.
